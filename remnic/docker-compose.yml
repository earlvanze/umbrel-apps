version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: remnic_server_1
      APP_PORT: 4318
      PROXY_AUTH_WHITELIST: "/mcp,/engram/v1/*,/remnic/v1/*"

  server:
    image: ghcr.io/joshuaswarren/remnic:sha-e17302c@sha256:cd6c1b1bfb948ffa114ba641192d8b8f331735fa58f602d851f081deb057e3f5
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      REMNIC_AUTH_TOKEN: ${APP_PASSWORD}
      REMNIC_ADMIN_CONSOLE_ENABLED: "true"
      REMNIC_ADMIN_CONSOLE_PREFILL_TOKEN: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/data
