version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: ollama_dashboard_1
      APP_PORT: 11434
      PROXY_AUTH_ADD: "false"

  dashboard:
    image: node:22-alpine@sha256:ab07539e0988b63558ff621f5fbe1077054c39d9809112974fb79993949d41cd
    command: ["node", "/app/server.js"]
    environment:
      PORT: "11434"
      OLLAMA_BASE_URL: "http://ollama_ollama_1:11434"
      CONFIG_DIR: "/config"
    volumes:
      - ./dashboard:/app:ro
      - ${APP_DATA_DIR}/data:/config
    depends_on:
      - ollama
    restart: on-failure

  ollama:
    image: ollama/ollama:0.32.6@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    environment:
      OLLAMA_ORIGINS: "*"
      OLLAMA_CONTEXT_LENGTH: 8192
    volumes:
      - ${APP_DATA_DIR}/data:/root/.ollama
    restart: on-failure
