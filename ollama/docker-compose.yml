version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: ollama_dashboard_1
      APP_PORT: 11434
      PROXY_AUTH_WHITELIST: "/api/*,/v1/*"

  dashboard:
    image: ghcr.io/earlvanze/ollama-umbrel-dashboard:0.2.0@sha256:efd6ea73ab6c34d8c36c8d6297449c6a98b4753fcab853d65baba050971776fb
    user: "1000:1000"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: "11434"
      OLLAMA_BASE_URL: "http://ollama_ollama_1:11434"
      CONFIG_DIR: "/config"
    volumes:
      - ${APP_DATA_DIR}/data:/config
    tmpfs:
      - /tmp
    depends_on:
      - ollama
    restart: on-failure

  ollama:
    image: ollama/ollama:0.32.6@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    environment:
      OLLAMA_ORIGINS: "*"
      OLLAMA_CONTEXT_LENGTH: 8192
    volumes:
      - ${APP_DATA_DIR}/data:/root/.ollama
    restart: on-failure
